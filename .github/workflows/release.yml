name: Release desktop app

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin
            label: macos-arm64
          - platform: macos-latest
            args: --target x86_64-apple-darwin
            label: macos-x64
          - platform: windows-latest
            args: ''
            label: windows
          - platform: ubuntu-latest
            args: ''
            label: linux
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - name: Install frontend dependencies
        run: npm ci
      - name: Install Linux bundle dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Install Rust targets
        if: startsWith(matrix.label, 'macos-')
        run: rustup target add ${{ matrix.args }}
      - name: Build and publish bundles
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Local Sketch Deck ${{ github.ref_name }}
          releaseBody: Unsigned desktop builds. macOS users may need to right-click → Open; Windows may show SmartScreen.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
  manifest:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download release bundles
        env: { GH_TOKEN: ${{ secrets.GITHUB_TOKEN }} }
        run: |
          mkdir release-assets
          gh release download "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --dir release-assets --pattern '*.dmg' --pattern '*.msi' --pattern '*.exe' --pattern '*.AppImage' --pattern '*.deb'
      - name: Build checksums and latest manifest
        env: { GH_TOKEN: ${{ secrets.GITHUB_TOKEN }} }
        run: |
          cd release-assets
          sha256sum * > SHA256SUMS
          gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${GITHUB_REF_NAME}" > release.json
          python3 - <<'PY'
          import json,os
          assets=json.load(open('release.json'))['assets']
          def pick(*suffixes):
            return next((a['browser_download_url'] for a in assets if a['name'].endswith(suffixes)), '')
          open('latest.json','w').write(json.dumps({'version':os.environ['GITHUB_REF_NAME'],'platforms':{
            'macOS':{'url':pick('.dmg')},'Windows':{'url':pick('.msi','.exe')},'Linux':{'url':pick('.AppImage','.deb')}}}))
          PY
      - name: Upload checksum and manifest
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: release-assets/SHA256SUMS,release-assets/latest.json
